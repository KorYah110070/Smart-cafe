{% extends "dashboard/base_admin.html" %}
{% block title %}ลบเมนู - Smart Cafe{% endblock %}

{% block content %}
<h1>ลบเมนู "{{ object.name }}"</h1>
<div class="td-card" style="max-width:460px;">
  <div class="td-card-body">
    <p>ยืนยันการลบเมนูนี้? การลบนี้ไม่สามารถย้อนกลับได้</p>
    <form method="post">
      {% csrf_token %}
      <div style="display:flex;gap:10px;">
        <button type="submit" class="td-btn td-btn-danger">ยืนยันลบ</button>
        <a href="{% url 'menus:manage' %}" class="td-btn">ยกเลิก</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
