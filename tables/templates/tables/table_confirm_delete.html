{% extends "dashboard/base_admin.html" %}
{% block title %}ลบโต๊ะ - Smart Cafe{% endblock %}

{% block content %}
<h1>ลบโต๊ะ T{{ object.table_number }}</h1>
<div class="td-card" style="max-width:460px;">
  <div class="td-card-body">
    <p>ยืนยันการลบโต๊ะ T{{ object.table_number }} (โซน {{ object.zone|default:"-" }})? การลบนี้ไม่สามารถย้อนกลับได้</p>
    <form method="post">
      {% csrf_token %}
      <div style="display:flex;gap:10px;">
        <button type="submit" class="td-btn td-btn-danger">ยืนยันลบ</button>
        <a href="{% url 'tables:manage' %}" class="td-btn">ยกเลิก</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
