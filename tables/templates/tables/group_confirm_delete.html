{% extends "dashboard/base_admin.html" %}
{% block title %}ลบชุดโต๊ะรวม - Smart Cafe{% endblock %}

{% block content %}
<h1>ลบชุดโต๊ะรวม "{{ object.group_name }}"</h1>
<div class="td-card" style="max-width:460px;">
  <div class="td-card-body">
    <p>ยืนยันการลบชุดโต๊ะรวมนี้?</p>
    <form method="post">
      {% csrf_token %}
      <div style="display:flex;gap:10px;">
        <button type="submit" class="td-btn td-btn-danger">ยืนยันลบ</button>
        <a href="{% url 'tables:group_list' %}" class="td-btn">ยกเลิก</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
