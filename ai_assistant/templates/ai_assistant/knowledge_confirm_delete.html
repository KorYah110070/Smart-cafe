{% extends "dashboard/base_admin.html" %}
{% block title %}ลบข้อมูลความรู้ - Smart Cafe{% endblock %}

{% block content %}
<h1>ลบข้อมูลความรู้นี้?</h1>
<div class="td-card" style="max-width:460px;">
  <div class="td-card-body">
    <p style="color:var(--text-dim);">{{ object.content|truncatechars:160 }}</p>
    <form method="post">
      {% csrf_token %}
      <div style="display:flex;gap:10px;">
        <button type="submit" class="td-btn td-btn-danger">ยืนยันลบ</button>
        <a href="{% url 'ai_assistant:manage' %}" class="td-btn">ยกเลิก</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
